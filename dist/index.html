  <style>
    #sakura-canvas {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 1; overflow: hidden;
    }
    .petal {
      position: absolute;
      top: -30px;
      border-radius: 50% 0 50% 0;
      opacity: 0;
      animation-timing-function: linear;
      animation-iteration-count: infinite;

  </style>
  <div id="sakura-canvas" aria-hidden="true"></div>
  <script>
  (function() {
    var colors = ['rgba(255,192,203,0.75)','rgba(255,182,193,0.65)','rgba(255,210,220,0.7)','rgba(255,230,235,0.6)','rgba(255,160,180,0.55)'];
    var canvas = document.getElementById('sakura-canvas');
    // 각 꽃잎마다 고유 @keyframes 생성 → CSS 커스텀 프로퍼티 불필요 (모바일 완전 호환)
    var styleEl = document.createElement('style');
    document.head.appendChild(styleEl);
    var count = 28;
    for (var i = 0; i < count; i++) {
      (function(i) {
        var size     = 6 + Math.random() * 10;
        var left     = Math.random() * 100;
        var duration = 7 + Math.random() * 10;
        var delay    = i < 14 ? -(Math.random() * duration) : Math.random() * 8;
        var drift    = Math.round(Math.random() * 120 - 60);
        var spin     = Math.round(Math.random() * 720 - 360);
        var color    = colors[Math.floor(Math.random() * colors.length)];
        var name     = 'pf' + i;

        styleEl.textContent +=
          '@keyframes ' + name + '{' +
          '0%{opacity:0;transform:translateY(0) translateX(0) rotate(0deg) scale(1);}' +
          '5%{opacity:0.85;}' +
          '90%{opacity:0.7;}' +
          '100%{opacity:0;transform:translateY(110vh) translateX(' + drift + 'px) rotate(' + spin + 'deg) scale(0.6);}' +
          '}';

        var p = document.createElement('div');
        p.className = 'petal';
        p.style.width           = size + 'px';
        p.style.height          = Math.round(size * 0.7) + 'px';
        p.style.left            = left + '%';
        p.style.background      = color;
        p.style.animationName   = name;
        p.style.animationDuration      = duration + 's';
        p.style.animationDelay         = delay + 's';
        canvas.appendChild(p);
      })(i);
    }
  })();
  </script>

  <!-- 모바일 letter-spacing JS 강제 보정 -->
  <script>
  (function() {
    if (window.innerWidth >= 768) return;
    function fixLS(root) {
      (root || document).querySelectorAll('[style]').forEach(function(el) {
        if (el.style.letterSpacing && el.style.letterSpacing !== '0px') {
          el.style.letterSpacing = '0px';
        }
      });
    }
    // DOM 변경 시마다 실행
    var obs = new MutationObserver(function() { fixLS(document); });
    obs.observe(document.documentElement, { childList: true, subtree: true });
    document.addEventListener('DOMContentLoaded', function() { fixLS(document); });
  })();
  </script>

  <script>
  function closePilgrimagePanel() {
    var p = document.getElementById('pilgrimage-panel');
    var b = document.getElementById('pilgrimage-btn');
    if (p && p.style.display !== 'none') {
      p.style.display = 'none';
      if (b) { var sp = b.querySelector('span:last-child'); if (sp) sp.textContent = '›'; }
    }
  }
  function mhScrollTo(el) {
    if (!el) return;
    var rect = el.getBoundingClientRect();
    var offset = window.pageYOffset + rect.top - 60; // 52px 헤더 + 8px 여유
    window.scrollTo({ top: Math.max(0, offset), behavior: 'smooth' });
  }
  function mhGo(mode) {
    closePilgrimagePanel();
    var btn = document.querySelector('.mode-toggle-btn[data-mode="' + mode + '"]');
    if (btn) {
      btn.click();
      setTimeout(function() {
        var target;
        if (mode === 'dream') target = document.getElementById('dream-page');
        else if (mode === 'taegil') target = document.getElementById('taegil-page');
        else target = document.querySelector('.mode-toggle-wrap') || document.querySelector('#submit-btn');
        mhScrollTo(target);
      }, 200);
    }
  }
  </script>

    #ch span{color:#fff;font-size:14px;font-weight:700}
    #cc{background:none;border:none;color:rgba(255,255,255,0.6);font-size:18px;cursor:pointer;padding:0}
    #cm{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;max-height:320px}
    .cmsg{max-width:85%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.6}
    .cmsg.bot{background:rgba(0,180,255,0.12);color:#cce6ff;border-bottom-left-radius:4px;align-self:flex-start}
    .cmsg.user{background:rgba(0,95,163,0.5);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
    #cr{display:flex;gap:8px;padding:10px 12px;border-top:1px solid rgba(255,255,255,0.08)}
    #ci{flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:#fff;font-size:13px;padding:8px 12px;outline:none;font-family:inherit}
    #cs{background:linear-gradient(135deg,#005fa3,#00b4d8);border:none;color:#fff;border-radius:10px;padding:8px 14px;font-size:13px;cursor:pointer;font-weight:700}
    #cs:hover{opacity:0.85}
  </style>
  <div id="cw">
    <div id="cp">
      <div id="ch"><span>&#127807; 인연 길잡이</span><button id="cc">&#10005;</button></div>
      <div id="cm">
        <div class="cmsg bot">안녕하세요! 인연 길잡이예요 &#128522;<br>사찰 방문, 사주팔자, 오행, 꿈해몽 등 무엇이든 물어보세요.</div>
      </div>
      <div id="cr"><input id="ci" type="text" placeholder="메시지를 입력하세요..." /><button id="cs">전송</button></div>
    </div>
    <button id="cb" title="인연 길잡이 상담"><span class="cb-icon">&#128172;</span>AI상담</button>
  </div>
  <script>
    (function(){
      var panel=document.getElementById('cp'),bubble=document.getElementById('cb'),
          close=document.getElementById('cc'),msgs=document.getElementById('cm'),
          inp=document.getElementById('ci'),snd=document.getElementById('cs'),
          hist=[];
      var firstBot=msgs&&msgs.querySelector('.cmsg.bot');
      if(firstBot)firstBot.innerHTML='안녕하세요! 인연 길잡이예요 &#128522;<br>사찰 방문, 사주팔자, 오행, 꿈해몽 등 무엇이든 물어보세요.';
      bubble.onclick=function(){panel.classList.toggle('open');if(panel.classList.contains('open'))inp.focus();};
      close.onclick=function(){panel.classList.remove('open');};
      function addMsg(t,r){var d=document.createElement('div');d.className='cmsg '+r;d.textContent=t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d;}
      async function send(){
        var t=inp.value.trim();if(!t)return;
        inp.value='';addMsg(t,'user');hist.push({role:'user',content:t});
        var ld=addMsg('...','bot');snd.disabled=true;
        try{
          var body={messages:hist.slice(-12)};
          var sc=window._sajuContext;if(sc)body.sajuContext=sc;
          var gc=window._gunghamContext;if(gc)body.gunghamContext=gc;
          var dc=window._dreamContext;if(dc)body.dreamContext=dc;
          var r=await fetch('/api/chatbot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
          var txt=await r.text();
          var d;try{d=JSON.parse(txt);}catch(_){d={};}
          if(!r.ok){ld.textContent=d.error||('서버 오류 '+r.status);hist.push({role:'assistant',content:ld.textContent});return;}
          var rep=d.reply||'잠시 연결이 어렵습니다.';
          ld.textContent=rep;hist.push({role:'assistant',content:rep});
        }catch(e){ld.textContent='오류: '+e.message;}
        finally{snd.disabled=false;msgs.scrollTop=msgs.scrollHeight;}
      }
      snd.onclick=send;
      inp.onkeydown=function(e){if(e.key==='Enter')send();};
    })();
  </script>
</body>
</html>
