  {t:'가람',h:'伽藍',d:'절(사찰)을 뜻하는 말. 승가라마(僧伽藍摩)의 줄임말로 스님들이 사는 곳.',c:'사찰'},

  {t:'나한',h:'羅漢',d:'부처님의 제자 중 최고 경지에 이른 성인. 나한전에 모시며 소원 기도처로 유명.',c:'부처·보살'},

  {t:'사물',h:'四物',d:'사찰의 네 가지 악기 — 범종·법고·목어·운판. 새벽과 저녁 예불 시 타주.',c:'사찰'},
  {t:'삼배',h:'三拜',d:'부처님께 세 번 절하는 예법. 오체투지 형태로 이마·두 팔꿈치·두 무릎을 땅에 댐.',c:'기도'},
  {t:'삼보',h:'三寶',d:'불교의 세 가지 보물 — 불(佛·부처님)·법(法·가르침)·승(僧·스님).',c:'교리'},

  {t:'승보',h:'僧寶',d:'삼보 중 하나. 스님(승가). 승보사찰은 많은 고승을 배출한 사찰.',c:'교리'},

  {t:'안거',h:'安居',d:'스님들이 일정 기간 한 곳에 머물며 수행하는 제도. 하안거·동안거.',c:'수행'},
  {t:'약사여래',h:'藥師如來',d:'동방 유리광 세계의 부처님. 모든 질병을 치유하는 부처님. 약사재일(음력 8일) 기도.',c:'부처·보살'},

  {t:'오행',h:'五行',d:'목(木)·화(火)·토(土)·금(金)·수(水) 다섯 기운. 사주명리학의 핵심 개념.',c:'사주'},
  {t:'오체투지',h:'五體投地',d:'이마·두 손·두 무릎이 모두 땅에 닿는 절. 가장 정성된 예경 방법.',c:'기도'},
  {t:'우란분절',h:'盂蘭盆節',d:'음력 7월 15일. 조상 천도 기도를 드리는 날. \'백중\'이라고도 불림.',c:'기도'},

var filtered=DICT;

function buildAlpha(){
  var initials=['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ','1~9'];
  var html='<button type="button" class="dc-a-btn active" onclick="alpha(\'all\',this)">전체</button>';
  initials.forEach(function(a){html+='<button type="button" class="dc-a-btn" onclick="alpha(\''+a+'\',this)">'+a+'</button>';});
  document.getElementById('dc-alpha').innerHTML=html;
}

function getInitial(ch){
  var code=ch.charCodeAt(0)-0xAC00;
  if(code<0||code>11171)return ch;
  var INIT=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  return INIT[Math.floor(code/588)];
}

function alpha(a,btn){
  document.querySelectorAll('.dc-a-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById('dc-search').value='';
  if(a==='all'){filtered=DICT;}
  else if(a==='1~9'){filtered=DICT.filter(function(d){return /^[0-9]/.test(d.t);});}
  else{filtered=DICT.filter(function(d){return getInitial(d.t[0])===a;});}
  render();
}

function search(){
  var q=document.getElementById('dc-search').value.trim().toLowerCase();
  document.querySelectorAll('.dc-a-btn').forEach(function(b){b.classList.remove('active');});
  document.querySelector('.dc-a-btn').classList.add('active');
  if(!q){filtered=DICT;}
  else{filtered=DICT.filter(function(d){return d.t.includes(q)||d.d.toLowerCase().includes(q)||d.c.includes(q);});}
  render();
}

function render(){
  document.getElementById('dc-count').textContent='총 '+filtered.length+'개 용어';
  if(!filtered.length){document.getElementById('dc-list').innerHTML='<div class="dc-empty">검색 결과가 없습니다.</div>';return;}
  var sorted=filtered.slice().sort(function(a,b){return a.t.localeCompare(b.t,'ko');});
  var html='';
  sorted.forEach(function(d){
    html+='<div class="dc-item">';
    html+='<div><div class="dc-term">'+d.t+'</div><div class="dc-hanja">'+d.h+'</div><span class="dc-cat">'+d.c+'</span></div>';
    html+='<div class="dc-def">'+d.d+'</div>';
    html+='</div>';
  });
  document.getElementById('dc-list').innerHTML=html;
}

buildAlpha();
filtered=DICT;
render();
</script>
