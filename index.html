<head>
  <meta charset="UTF-8" />

  <meta property="og:url" content="https://jamgong-inyeonsachal.vercel.app" />

  <meta property="og:description" content="생년월일시의 오행 기운을 바탕으로, 지금 이 순간 당신에게 필요한 사찰을 안내합니다." />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="잼공인연사찰 — 나와 인연이 닿는 절을 찾다" />
  <meta name="twitter:description" content="생년월일시의 오행 기운을 바탕으로, 지금 이 순간 당신에게 필요한 사찰을 안내합니다." />
  <meta name="twitter:image" content="/og-image.png" />

  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- 업그레이드 공지 배너 -->
  <style>
    @keyframes bannerGlow {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes bannerPulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.75; }
    }
    @keyframes starSpin {
      0%   { transform: rotate(0deg) scale(1); }
      50%  { transform: rotate(180deg) scale(1.3); }
      100% { transform: rotate(360deg) scale(1); }
    }
    #upgrade-banner {
      background: linear-gradient(270deg, #003580, #005fa3, #00b4d8, #005fa3, #003580);
      background-size: 400% 400%;
      animation: bannerGlow 4s ease infinite;
      border-bottom: 2px solid rgba(0,210,255,0.7);
      padding: 13px 20px;
      text-align: center;
      font-size: 14px;
      color: #fff;
      font-weight: 700;
      letter-spacing: 0.4px;
      position: sticky;
      top: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 3px 20px rgba(0,180,255,0.4);
      text-shadow: 0 0 12px rgba(0,210,255,0.8);
    }
    #upgrade-banner .banner-icon {
      font-size: 20px;
      animation: starSpin 3s linear infinite;
      display: inline-block;
    }
    #upgrade-banner .banner-text {
      animation: bannerPulse 2.5s ease-in-out infinite;
    }
    #upgrade-banner .banner-close {
      background: rgba(255,255,255,0.15);
      border: 1.5px solid rgba(255,255,255,0.5);
      color: #fff;
      border-radius: 8px;
      padding: 3px 14px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    #upgrade-banner .banner-close:hover {
      background: rgba(255,255,255,0.3);
    }
  </style>
  <div id="upgrade-banner">
    <span class="banner-icon">✨</span>
    <span class="banner-text">🔔 서비스 구축 중 — 사찰 데이터와 사주(만세력) 분석 기능이 지속적으로 추가되고 있습니다.</span>
    <button class="banner-close" onclick="document.getElementById('upgrade-banner').style.display='none'">닫기</button>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
