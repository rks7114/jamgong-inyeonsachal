<body>
  <!-- 서비스 공지 팝업 -->
  <style>
    #notice-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #notice-popup {
      background: #0d1b2e;
      border: 1.5px solid rgba(0,180,255,0.4);
      border-radius: 16px;
      padding: 36px 32px 28px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,120,255,0.3);
      color: #fff;
    }
    #notice-popup .np-icon { font-size: 36px; margin-bottom: 12px; }
    #notice-popup .np-title {
      font-size: 18px;
      font-weight: 800;
      color: #4fc3f7;
      margin-bottom: 14px;
      letter-spacing: 0.3px;
    }
    #notice-popup .np-body {
      font-size: 14px;
      line-height: 1.7;
      color: #cce6ff;
      margin-bottom: 24px;
    }
    #notice-popup .np-close {
      background: linear-gradient(135deg, #005fa3, #00b4d8);
      border: none;
      color: #fff;
      border-radius: 10px;
      padding: 10px 36px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    #notice-popup .np-close:hover { opacity: 0.85; }
  </style>
  <div id="notice-overlay" onclick="if(event.target===this)document.getElementById('notice-overlay').style.display='none'">
    <div id="notice-popup">
      <div class="np-icon">🔔</div>
      <div class="np-title">서비스 구축 중</div>
      <div class="np-body">
        사찰 데이터와 사주(만세력) 분석 기능이<br>
        지속적으로 추가되고 있습니다.<br><br>
        일부 정보가 아직 완성되지 않았을 수 있으며,<br>
        더 나은 서비스로 곧 찾아뵙겠습니다.
      </div>
      <button class="np-close" onclick="document.getElementById('notice-overlay').style.display='none'">확인</button>
    </div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
