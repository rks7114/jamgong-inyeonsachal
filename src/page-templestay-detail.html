(function(){
  var id=(new URLSearchParams(location.search).get('id')||'').toLowerCase();
  var d=DB[id];
  if(!d){document.getElementById('not-found').style.display='block';return;}
  document.getElementById('pg-wrap').style.display='block';
  document.title=d.name+' 템플스테이 | 잼공인연사찰';
  document.getElementById('pg-title').textContent=d.name+' 템플스테이 | 잼공인연사찰';

  // Wikipedia 이미지 자동 로드
  var img=document.getElementById('pg-img');
  img.alt=d.name;
  img.src=d.imgFb||''; // 폴백 먼저 표시
  function loadWikiImg(name,fbUrl){
    var base='https://ko.wikipedia.org';
    fetch(base+'/api/rest_v1/page/summary/'+encodeURIComponent(name))
      .then(function(r){return r.json();})
      .then(function(d2){
        var src=d2.originalimage||d2.thumbnail;
        if(src&&src.source){
          img.src=src.source.replace(/\/\d+px-/,'/800px-');
        } else if(fbUrl){img.src=fbUrl;}
      })
      .catch(function(){if(fbUrl)img.src=fbUrl;});
  }
  loadWikiImg(d.wikiName||d.name, d.imgFb);

  // 뱃지
  document.getElementById('pg-badges').innerHTML=d.badges.map(function(b){return'<span class="hb '+b.c+'">'+b.t+'</span>';}).join('');
  document.getElementById('pg-name').textContent=d.name;
  document.getElementById('pg-loc').textContent='📍 '+d.loc;

  // 인포
  document.getElementById('pg-info-row').innerHTML=d.info.map(function(i){
    return'<div class="info-box"><div class="info-box-label">'+i.l+'</div><div class="info-box-val'+(i.g?' gold':'')+'">'+i.v+'</div></div>';
  }).join('');

  // 소개
  document.getElementById('pg-intro').innerHTML=d.intro;

  // 프로그램
  document.getElementById('pg-programs').innerHTML=d.programs.map(function(p){
    return'<li class="prog-item"><div class="prog-icon">'+p.icon+'</div><div><div class="prog-name">'+p.name+'</div><div class="prog-desc">'+p.desc+'</div></div></li>';
  }).join('');

  // 일정
  document.getElementById('pg-schedule').innerHTML=d.schedule.map(function(s){
    return'<li class="tl-item"><span class="tl-time">'+s.t+'</span><div><div class="tl-title">'+s.n+'</div><div class="tl-desc">'+s.d+'</div></div></li>';
  }).join('');

  // 가격
  document.getElementById('pg-prices').innerHTML=d.prices.map(function(p){
    return'<div class="price-box"><div class="price-type">'+p.type+'</div><div class="price-val">'+p.val+'</div><div class="price-note">'+p.note+'</div></div>';
  }).join('');

  // 교통
  document.getElementById('pg-access').innerHTML=d.access;

  // 태그
  document.getElementById('pg-tags').innerHTML=d.tags.map(function(t){return'<span class="tag">'+t+'</span>';}).join('');

  // CTA
  document.getElementById('pg-cta-text').innerHTML=d.ctaText.replace(/\n/g,'<br>');
  document.getElementById('pg-map-btn').href=d.map;
})();
</script>
