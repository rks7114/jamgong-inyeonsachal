<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}

/* 히어로 */
.td-hero{position:relative;padding:80px 24px 60px;text-align:center;background:linear-gradient(135deg,#1e1b4b 0%,#0f172a 60%,#1a1a2e 100%);overflow:hidden}
.td-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 50% at 50% 30%,rgba(139,92,246,0.15),transparent)}
.td-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.3);color:#FBBF24;font-size:11px;font-weight:800;letter-spacing:.15em;padding:5px 16px;border-radius:20px;margin-bottom:16px}
.td-title{font-size:clamp(28px,5vw,48px);font-weight:900;color:#f8fafc;margin-bottom:10px;line-height:1.2}
.td-addr{font-size:15px;color:#64748b;margin-bottom:20px}
.td-tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
.td-tag{font-size:13px;font-weight:700;padding:5px 14px;border-radius:20px}

/* 지도 버튼 */
.td-map-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.td-map-btn{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:700;padding:12px 24px;border-radius:12px;text-decoration:none;transition:all .2s}
.td-map-btn:hover{transform:translateY(-2px)}

/* 본문 */
.td-body{max-width:860px;margin:0 auto;padding:48px 24px 80px}

/* 섹션 카드 */
.td-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:20px;padding:28px;margin-bottom:20px}
.td-card-title{font-size:17px;font-weight:800;color:#FBBF24;letter-spacing:.06em;margin-bottom:18px}
.td-card-body{font-size:17px;color:#94a3b8;line-height:2.1}
.td-card-body strong{color:#f8fafc}

/* 정보 그리드 */
.td-info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.td-info-item{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:14px}
.td-info-label{font-size:13px;font-weight:700;color:#475569;letter-spacing:.05em;margin-bottom:6px}
.td-info-value{font-size:16px;color:#e2e8f0;font-weight:600}

/* 기도 유형 배지 */
.td-prayer-grid{display:flex;gap:8px;flex-wrap:wrap}
.td-prayer-badge{font-size:14px;font-weight:700;padding:8px 18px;border-radius:20px;border:1px solid}

/* 구글맵 임베드 */
.td-map-embed{width:100%;height:320px;border-radius:16px;border:1px solid rgba(255,255,255,0.08);overflow:hidden;margin-top:16px}
.td-map-embed iframe{width:100%;height:100%;border:none}

/* 관련 링크 */
.td-links{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.td-link-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:16px;text-decoration:none;color:inherit;display:block;transition:all .2s}
.td-link-card:hover{border-color:rgba(251,191,36,0.4);background:rgba(251,191,36,0.05);transform:translateY(-2px)}
.td-link-icon{font-size:22px;margin-bottom:8px}
.td-link-name{font-size:13px;font-weight:700;color:#f8fafc;margin-bottom:4px}
.td-link-desc{font-size:11px;color:#64748b}

/* 주변 사찰 카드 */
.td-nearby-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.td-nearby-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:14px;cursor:pointer;text-decoration:none;display:block;transition:all .2s}
.td-nearby-card:hover{background:rgba(139,92,246,0.08);border-color:rgba(139,92,246,0.35);transform:translateY(-2px)}
.td-nearby-name{font-size:14px;font-weight:700;color:#f1f5f9;margin-bottom:4px}

.td-nearby-addr{font-size:11px;color:#64748b;line-height:1.4}
.td-nearby-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.td-nearby-tag{font-size:9px;font-weight:600;padding:2px 7px;border-radius:20px;background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.25);color:#FBBF24}

#jg-top-btn{position:fixed;bottom:80px;right:18px;z-index:99998;width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#FBBF24,#f59e0b);color:#0a0a0a;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(251,191,36,.45);cursor:pointer;border:none;outline:none;opacity:0;pointer-events:none;transition:opacity .3s,transform .2s}
#jg-top-btn.show{opacity:1;pointer-events:auto}
#jg-top-btn:active{transform:scale(.9)}

@media(max-width:640px){
  .td-hero{padding:60px 16px 40px}
  .td-body{padding:32px 16px 60px}
  .td-card{padding:20px}
}
</style>

/* ── URL 파라미터에서 사찰 키 추출 ── */
function getParam(key){
  var p=new URLSearchParams(window.location.search);
  return p.get(key)||'';
}

function normalizeKey(s){
  return s.replace(/\s/g,'').replace(/[·\-_]/g,'').toLowerCase();
}

function findTemple(query){
  if(!query) return null;
  var nq=normalizeKey(query);

  // 1순위: 큐레이션 DB (스토리·상세 정보 있는 영험 사찰)
  for(var k in TEMPLE_DB){
    if(normalizeKey(k)===nq || normalizeKey(TEMPLE_DB[k].name)===nq) return TEMPLE_DB[k];
  }
  for(var k in TEMPLE_DB){
    if(normalizeKey(k).includes(nq) || nq.includes(normalizeKey(k))) return TEMPLE_DB[k];
  }

  // 2순위: 전체 17,497개 DB
  if(typeof TEMPLE_DETAIL_DB !== 'undefined'){
    // 정확 일치
    var found = TEMPLE_DETAIL_DB.find(function(t){ return normalizeKey(t.n)===nq; });
    // 부분 일치
    if(!found) found = TEMPLE_DETAIL_DB.find(function(t){ return normalizeKey(t.n).includes(nq) || nq.includes(normalizeKey(t.n)); });
    if(found){
      // 전체 DB 포맷 → 큐레이션 포맷으로 변환
      var pColors=['#c4b5fd','#34d399','#fbbf24','#f472b6','#60a5fa','#fb923c'];
      var sidoFull={
        '서울':'서울특별시','경기':'경기도','인천':'인천광역시',
        '강원':'강원도','충북':'충청북도','충남':'충청남도',
        '대전':'대전광역시','세종':'세종특별자치시',
        '경북':'경상북도','경남':'경상남도','대구':'대구광역시',
        '울산':'울산광역시','부산':'부산광역시',
        '전북':'전라북도','전남':'전라남도','광주':'광주광역시','제주':'제주특별자치도'
      };
      var sidoLong = sidoFull[found.s] || found.s || '';
      var prayers = found.p || [];
      var prayerDescs = {
        '재물운':'재물·사업 기도처로','건강운':'건강·치유 기도처로','소원성취':'소원성취 기도처로',
        '합격기도':'학업·합격 기도처로','관음기도':'관음 신앙의','인연기도':'인연·결혼 기도처로',
        '선기도':'참선 수행 도량으로','지혜기도':'지혜를 구하는 기도처로',
        '천도재':'천도재·추모 기도처로'
      };
      // 자동 소개 생성
      var intro = found.n + (found.n.slice(-1)==='사'||found.n.slice(-1)==='암'?'은':'은') + ' ';
      intro += (found.g ? sidoLong+' '+found.g : sidoLong) + '에 자리한';
      if(found.se) intro += ' ' + found.se + ' 소속';
      intro += ' 사찰입니다.';
      if(found.fy) intro += ' ' + found.fy + '년에 창건된 유서 깊은 도량으로,';
      if(prayers.length>0){
        var pdesc = prayerDescs[prayers[0]] || (prayers[0]+' 기도처로');
        intro += ' ' + pdesc + ' 널리 알려져 있으며,';
      }
      intro += ' 지역 불자들의 신앙 생활의 중심이 되고 있습니다.';
      if(found.h && found.h.length>10) intro += '\n\n' + found.h;

      return {
        name: found.n,
        badge: '🏯 ' + (found.se||'사찰'),
        addr: found.a || (found.s+' '+found.g),
        sido: sidoLong || found.s,
        prayers: prayers,
        prayerColors: pColors,
        intro: intro,
        mapQuery: found.n+' '+(found.a||found.s+' '+found.g),
        category: found.se || '사찰',
        established: found.fy ? found.fy+'년' : '',
        lat: found.la,
        lng: found.lo,
        _raw: found
      };
    }
  }
  return null;
}

        '<a class="td-map-btn" style="background:rgba(139,92,246,0.15);border:1px solid rgba(139,92,246,0.35);color:#a78bfa" href="page-temple-search.html">🏯 전체 사찰 검색</a>';

  if(t.lat && t.lng && t.lat !== 0 && typeof TEMPLE_DETAIL_DB !== 'undefined'){
    setTimeout(function(){
      var nearby = findNearby(t.lat, t.lng, t.name, 6);

        nearby.forEach(function(item){
          var nt = item.t;
          var dist = item.dist < 1 ? Math.round(item.dist*1000)+'m' : item.dist.toFixed(1)+'km';
          var tags = (nt.p||[]).slice(0,2).map(function(p){
            return '<span class="td-nearby-tag">'+escHtml(p)+'</span>';

          html += '</a>';
        });
        nearbyGrid.innerHTML = html;
      }
    }, 100);
  }
}

function findNearby(lat, lng, excludeName, maxCount){
  var R = 6371;
  var results = [];
  var latRad = lat * Math.PI / 180;
  for(var i=0; i<TEMPLE_DETAIL_DB.length; i++){
    var nt = TEMPLE_DETAIL_DB[i];
    if(!nt.la || !nt.lo || nt.la===0 || nt.n===excludeName) continue;
    var dlat = (nt.la - lat) * Math.PI / 180;
    var dlng = (nt.lo - lng) * Math.PI / 180;
    var a = Math.sin(dlat/2)*Math.sin(dlat/2) + Math.cos(latRad)*Math.cos(nt.la*Math.PI/180)*Math.sin(dlng/2)*Math.sin(dlng/2);
    var dist = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    if(dist < 5) results.push({t:nt, dist:dist});
  }
  results.sort(function(a,b){return a.dist-b.dist});
  return results.slice(0, maxCount||6);
}

function goSearch(){
  var v = (document.getElementById('td-search-input')||{}).value||'';
  if(v.trim()) location.href = 'page-temple-detail.html?name='+encodeURIComponent(v.trim());
}

function escHtml(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
