(function(){
  var id=(new URLSearchParams(location.search).get('id')||'').toLowerCase();
  var d=DB[id];
  if(!d){document.getElementById('not-found').style.display='block';return;}
  document.getElementById('pg-wrap').style.display='block';
  document.title=d.name+' 문화재 | 잼공인연사찰';

  // Wikipedia 이미지
  var img=document.getElementById('pg-img');
  img.alt=d.name; img.src=d.imgFb;
  fetch('https://ko.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(d.wikiName||d.name))
    .then(function(r){return r.json();})
    .then(function(w){
      var src=w.originalimage||w.thumbnail;
      if(src&&src.source)img.src=src.source.replace(/\/\d+px-/,'/800px-');
    }).catch(function(){});

  document.getElementById('pg-badges').innerHTML=d.badges.map(function(b){return'<span class="hb '+b.c+'">'+b.t+'</span>';}).join('');
  document.getElementById('pg-name').textContent=d.name;
  document.getElementById('pg-loc').textContent='📍 '+d.loc;
  document.getElementById('pg-info-row').innerHTML=d.info.map(function(i){
    return'<div class="info-box"><div class="info-label">'+i.l+'</div><div class="info-val'+(i.r?' red':i.g?' gold':'')+'">'+i.v+'</div></div>';
  }).join('');
  document.getElementById('pg-intro').innerHTML=d.intro;
  document.getElementById('pg-artifacts').innerHTML=d.artifacts.map(function(a){
    return'<div class="artifact-item"><span class="artifact-rank '+a.rc+'">'+a.rank+'</span><div><div class="artifact-name">'+a.name+'</div><div class="artifact-desc">'+a.desc+'</div></div></div>';
  }).join('');
  document.getElementById('pg-history').innerHTML=d.history;
  document.getElementById('pg-tips').innerHTML=d.tips.map(function(t){return'<li class="tip-item">'+t+'</li>';}).join('');
  document.getElementById('pg-access').innerHTML=d.access;
  document.getElementById('pg-tags').innerHTML=d.tags.map(function(t){return'<span class="tag">'+t+'</span>';}).join('');
  document.getElementById('pg-cta-title').textContent=d.ctaTitle;
  document.getElementById('pg-cta-text').textContent=d.ctaText;
  document.getElementById('pg-map-btn').href=d.map;
})();
</script>
