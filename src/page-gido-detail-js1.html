intro:`조계사는 <strong>대한불교조계종 총본산</strong>으로 서울 종로 한복판에 위치한 도심 기도도량입니다. 1395년 창건 이후 조선·근현대를 거치며 한국 불교의 중심이 되었습니다.<br><br>경내에는 <strong>대웅전(보물 제1762호)</strong>을 중심으로 사리탑·수령 500년 백송·느티나무 등 유서 깊은 문화재가 가득합니다. 매년 부처님오신날 연등축제는 서울의 대표 문화행사이며, 연중 새벽 4시부터 저녁까지 기도와 법회가 끊이지 않는 곳입니다.`,

{title:"대웅전 삼배",desc:"대웅전 석가모니불 앞에 삼배를 올립니다. 도심 속에서 가장 쉽게 접근할 수 있는 기도처입니다."},
{title:"관음전 기도",desc:"<strong>「나무관세음보살」</strong>을 108번 독송하며 소원을 발원합니다."},

history:`1395년(태조 4년) 창건된 태고사가 전신입니다. 일제강점기 불교 정화운동을 거쳐 1954년 현재의 조계사로 개칭, 조계종 총본산이 됐습니다. 대웅전은 보물 제1762호로 지정됐으며 경내 백송은 천연기념물 제9호입니다. 1975년부터 이어온 연등축제는 유네스코 인류무형문화유산으로 등재됐습니다.`,
prayers:[
{title:"관세음보살 정근",text:`나무관세음보살 나무관세음보살\n나무관세음보살 나무관세음보살\n나무관세음보살 나무관세음보살\n나무관세음보살 마하살\n\n(108번 반복)`,note:"대웅전·관음전 앞에서 독송합니다."},
{title:"소원성취 발원문",text:`부처님, 오늘 이 도량에서 간절히 발원합니다.\n\n저의 바람이 하늘에 닿아\n뜻하는 바가 모두 이루어지기를 기원합니다.\n지혜와 용기를 내려주시어\n바른 길로 나아갈 수 있게 해주소서.\n\n나무석가모니불\n나무관세음보살`,note:"대웅전 삼배 후 독송합니다. 연등 공양과 함께하면 더욱 영험합니다."},
{title:"연등 발원문",text:`이 등불을 밝혀\n세상의 어둠을 밝히듯\n저의 앞길도 환히 열리기를 발원합니다.\n\n부처님 법등이 항상 함께하여\n모든 어려움을 슬기롭게 헤쳐나가게 하시고\n소원하는 바가 원만히 성취되기를 기원합니다.\n\n나무석가모니불 나무관세음보살`,note:"연등 공양 시 독송합니다. 부처님오신날 연등축제 기간에 특히 영험합니다."}
],
