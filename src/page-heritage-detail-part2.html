(function(){
  var id=(new URLSearchParams(location.search).get('id')||'').toLowerCase();
  var d=DB[id];
  if(!d){document.getElementById('not-found').style.display='block';return;}
  document.getElementById('pg-wrap').style.display='block';
  document.title=d.name+' 문화재 | 잼공인연사찰';
  document.getElementById('pg-title').textContent=d.name+' 문화재 | 잼공인연사찰';
  var img=document.getElementById('pg-img');
  img.alt=d.name;
  img.src='';
  function loadWikiImg(name,fbUrl){
    fetch('https://ko.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(name))
      .then(function(r){return r.json();})
      .then(function(d2){
        var src=d2.originalimage||d2.thumbnail;
        if(src&&src.source)img.src=src.source.replace(/\/\d+px-/,'/800px-');
        else if(fbUrl)img.src=fbUrl;
      }).catch(function(){if(fbUrl)img.src=fbUrl;});
  }
  loadWikiImg(d.wikiName||d.name,null);
  document.getElementById('pg-badges').innerHTML=d.badges.map(function(b){return'<span class="hb '+b.c+'">'+b.t+'</span>';}).join('');
  document.getElementById('pg-name').textContent=d.name;
  document.getElementById('pg-loc').textContent='📍 '+d.loc;
  document.getElementById('pg-info-row').innerHTML=d.info.map(function(i){return'<div class="info-box"><div class="info-box-label">'+i.l+'</div><div class="info-box-val'+(i.g?' gold':'')+'">'+i.v+'</div></div>';}).join('');
  document.getElementById('pg-intro').innerHTML=d.intro;
  document.getElementById('pg-artifacts').innerHTML=d.artifacts.map(function(a){return'<li class="artifact-item"><div class="artifact-badge '+a.bc+'">'+a.badge+'</div><div><div class="artifact-name">'+a.name+'</div><div class="artifact-desc">'+a.desc+'</div></div></li>';}).join('');
  document.getElementById('pg-history').innerHTML=d.history;
  document.getElementById('pg-tips').innerHTML=d.tips.map(function(t){return'<li class="tip-item"><span class="tip-icon">'+t.icon+'</span><div class="tip-text">'+t.text+'</div></li>';}).join('');
  document.getElementById('pg-access').innerHTML=d.access;
  document.getElementById('pg-tags').innerHTML=d.tags.map(function(t){return'<span class="tag">'+t+'</span>';}).join('');
  document.getElementById('pg-cta-title').textContent=d.ctaTitle||'방문 안내';
  document.getElementById('pg-cta-text').innerHTML=d.ctaText.replace(/\n/g,'<br>');
  document.getElementById('pg-map-btn').href=d.map;
})();
</script>
