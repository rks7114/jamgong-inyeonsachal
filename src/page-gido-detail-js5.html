<script>
(function(){
const d=window._gidoData;
if(!d)return;
document.getElementById('id-btns').innerHTML=`
<a class="hero-btn hero-btn-map" href="https://map.naver.com/v5/search/${encodeURIComponent(d.mapQuery)}" target="_blank">🗺️ 네이버 지도</a>
<a class="hero-btn hero-btn-kakao" href="https://map.kakao.com/?q=${encodeURIComponent(d.name+' '+(d.mapQuery||d.region))}" target="_blank">📍 카카오 지도</a>
<a class="hero-btn hero-btn-back" href="/gido">← 목록으로</a>`;

d.info.forEach(i=>{document.getElementById('id-info-grid').innerHTML+=`<div class="info-item"><div class="info-label">${i.label}</div><div class="info-value">${i.value}</div></div>`;});
document.getElementById('id-intro').innerHTML=d.intro;
document.getElementById('id-history').innerHTML=d.history;
document.getElementById('id-access').innerHTML=d.access;
d.effects.forEach(e=>{document.getElementById('id-effects').innerHTML+=`<span class="effect-badge">${e}</span>`;});
d.steps.forEach((s,i)=>{document.getElementById('id-steps').innerHTML+=`<div class="step"><div class="step-num">${i+1}</div><div class="step-content"><strong>${s.title}</strong>${s.desc}</div></div>`;});

// 기도문 탭
window._prayerData=d.prayers;
const pEl=document.getElementById('id-prayers');
pEl.innerHTML=`<div class="prayer-tabs">${d.prayers.map((p,i)=>`<button class="prayer-tab${i===0?' active':''}" onclick="switchPrayer(${i})">${p.title}</button>`).join('')}</div>
<div class="prayer-wrap">
<div class="prayer-text" id="prayer-text">${d.prayers[0].text}</div>
<button class="prayer-audio-btn" id="audio-btn" onclick="playPrayer()">▶ 음성 듣기</button>
</div>
<div class="prayer-note" id="prayer-note">💡 ${d.prayers[0].note}</div>`;

document.getElementById('id-map').innerHTML=`<iframe src="https://www.google.com/maps?q=${encodeURIComponent(d.name+' '+d.region)}&output=embed" loading="lazy" style="width:100%;height:100%;border:none"></iframe>`;
d.related.forEach(r=>{document.getElementById('id-related').innerHTML+=`<a class="related-card" href="?id=${r.id}"><div class="related-icon">${r.icon}</div><div class="related-name">${r.name}</div><div class="related-desc">${r.desc}</div></a>`;});

const tl=document.getElementById('prem-temple-label');if(tl)tl.textContent=d.name+' 기도 기운';
window.addEventListener('scroll',()=>document.getElementById('top-btn').classList.toggle('show',scrollY>400));
})();

function switchPrayer(idx){
const data=window._prayerData;if(!data)return;
document.querySelectorAll('.prayer-tab').forEach((b,i)=>b.classList.toggle('active',i===idx));
document.getElementById('prayer-text').textContent=data[idx].text;
document.getElementById('prayer-note').textContent='💡 '+data[idx].note;
if(window._synth&&window.speechSynthesis.speaking)window.speechSynthesis.cancel();
const btn=document.getElementById('audio-btn');if(btn)btn.textContent='▶ 음성 듣기';
}

/* ── 기도문 음성 듣기 ── */
function playPrayer(){
if(!window.speechSynthesis){alert('이 브라우저는 음성 듣기를 지원하지 않습니다.');return;}
const btn=document.getElementById('audio-btn');
if(window.speechSynthesis.speaking){window.speechSynthesis.cancel();btn.textContent='▶ 음성 듣기';return;}
const text=document.getElementById('prayer-text').textContent;
const utt=new SpeechSynthesisUtterance(text);
utt.lang='ko-KR';utt.rate=0.75;utt.pitch=1.0;utt.volume=1;
const voices=window.speechSynthesis.getVoices().filter(v=>v.lang.startsWith('ko'));
if(voices.length>0)utt.voice=voices[0];
utt.onend=()=>{btn.textContent='▶ 음성 듣기';};
utt.onerror=()=>{btn.textContent='▶ 음성 듣기';};
btn.textContent='⏹ 정지';
window.speechSynthesis.speak(utt);
}

/* ── 스크롤 등장 ── */
const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target);}}),{threshold:.12});
document.querySelectorAll('.reveal').forEach((el,i)=>{el.style.transitionDelay=(i*.06)+'s';io.observe(el);});

/* ── 오행 ── */
function drawRadar(id,vals,accent,glow){
const cv=document.getElementById(id);if(!cv)return;
const ctx=cv.getContext('2d'),cx=90,cy=94,r=62,n=5;
ctx.clearRect(0,0,180,180);
for(let l=4;l>=1;l--){ctx.beginPath();for(let i=0;i<n;i++){const a=i*2*Math.PI/n-Math.PI/2;const x=cx+r*(l/4)*Math.cos(a),y=cy+r*(l/4)*Math.sin(a);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.closePath();ctx.fillStyle=`rgba(255,255,255,${.014*l})`;ctx.fill();ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=.6;ctx.stroke();}
for(let i=0;i<n;i++){const a=i*2*Math.PI/n-Math.PI/2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=1;ctx.stroke();const lx=cx+(r+16)*Math.cos(a),ly=cy+(r+16)*Math.sin(a);ctx.save();ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor=EC[i];ctx.shadowBlur=10;ctx.fillStyle=EC[i];ctx.fillText(EN[i],lx,ly);ctx.restore();}
const pts=vals.map((v,i)=>{const a=i*2*Math.PI/n-Math.PI/2,ratio=Math.max(.05,v/100);return[cx+r*ratio*Math.cos(a),cy+r*ratio*Math.sin(a)];});
ctx.save();ctx.beginPath();pts.forEach(([x,y],i)=>i===0?ctx.moveTo(x,y):ctx.lineTo(x,y));ctx.closePath();ctx.shadowColor=glow;ctx.shadowBlur=22;ctx.strokeStyle=accent;ctx.lineWidth=2.5;ctx.stroke();ctx.restore();
const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,glow+'60');g.addColorStop(.5,glow+'22');g.addColorStop(1,glow+'08');
ctx.beginPath();pts.forEach(([x,y],i)=>i===0?ctx.moveTo(x,y):ctx.lineTo(x,y));ctx.closePath();ctx.fillStyle=g;ctx.fill();
pts.forEach(([x,y],i)=>{ctx.save();ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.shadowColor=EC[i];ctx.shadowBlur=14;ctx.fillStyle=EC[i];ctx.fill();ctx.restore();});
}

function getOhaeng(bv){const y=new Date(bv).getFullYear(),b=(y-1900)%10;const t=[[60,20,15,10,25],[25,60,15,10,20],[20,25,10,10,55],[15,55,20,15,25],[55,20,15,15,25],[20,55,15,10,30],[15,20,10,10,65],[65,15,15,10,20],[20,15,10,10,70],[10,20,15,65,20]];return t[((b%10)+10)%10].map(x=>Math.max(8,Math.min(90,x+Math.floor(Math.random()*8)-4)));}

function countUp(el,target){let v=0;const t=setInterval(()=>{v=Math.min(v+1.8,target);el.textContent=Math.floor(v);if(v>=target)clearInterval(t);},18);}

(function initSelects(){
const y=document.getElementById('prem-year'),m=document.getElementById('prem-month'),d=document.getElementById('prem-day');
if(!y)return;
for(let yr=new Date().getFullYear();yr>=1930;yr--){const o=document.createElement('option');o.value=yr;o.textContent=yr+'년';if(yr===1990)o.selected=true;y.appendChild(o);}
for(let mo=1;mo<=12;mo++){const o=document.createElement('option');o.value=mo;o.textContent=mo+'월';if(mo===5)o.selected=true;m.appendChild(o);}
function upDays(){const max=new Date(+y.value,+m.value,0).getDate(),cur=+d.value||15;d.innerHTML='';for(let dy=1;dy<=max;dy++){const o=document.createElement('option');o.value=dy;o.textContent=dy+'일';if(dy===Math.min(cur,max))o.selected=true;d.appendChild(o);}}
y.addEventListener('change',upDays);m.addEventListener('change',upDays);upDays();
})();

function premAnalyze(){
const y=document.getElementById('prem-year').value,m=document.getElementById('prem-month').value,dd=document.getElementById('prem-day').value;
if(!y||!m||!dd)return;
const bv=`${y}-${String(m).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
const id=new URLSearchParams(location.search).get('id')||'naksan';
const tv=TO[id]||TO.naksan,uv=getOhaeng(bv);
let sc=55;uv.forEach((u,i)=>{if(u<35&&tv[i]>50)sc+=16;else if(u<35&&tv[i]>30)sc+=8;else if(u>65&&tv[i]<20)sc-=5;});
sc=Math.max(54,Math.min(98,sc+Math.floor(Math.random()*4)));
const pur=document.getElementById('prem-purpose').value;

document.getElementById('prem-result').style.display='block';
document.getElementById('prem-result').scrollIntoView({behavior:'smooth',block:'start'});
countUp(document.getElementById('prem-score-num'),sc);
setTimeout(()=>document.getElementById('prem-score-bar').style.width=sc+'%',100);
document.getElementById('prem-score-desc').innerHTML=sc>=88?`<strong style="color:#4ade80">매우 좋은 기도 궁합</strong> — 이 도량의 기운이 당신의 오행을 강하게 보완합니다.`:sc>=72?`<strong style="color:#a78bfa">좋은 기도 궁합</strong> — 이 도량에서의 기도가 소원 성취에 도움이 됩니다.`:`<strong style="color:#64748b">보통 궁합</strong> — 꾸준한 기도와 정성이 중요합니다.`;

setTimeout(()=>{
drawRadar('prem-my-chart',uv,'#7c3aed','#4c1d95');
drawRadar('prem-temple-chart',tv,'#a78bfa','#7c3aed');
const leg=document.getElementById('prem-my-legend');leg.innerHTML='';
EN.forEach((n,i)=>{leg.innerHTML+=`<span class="legend-item"><span class="legend-dot" style="background:${EC[i]}"></span>${n} ${uv[i]}</span>`;});
},300);

const de=document.getElementById('prem-dates');de.innerHTML='';
DATES.forEach((d,i)=>{de.innerHTML+=`<div class="date-row"><div class="date-num">${i+1}</div><div class="date-info"><div class="date-main">${d.date}</div><div class="date-sub">${d.lunar} · ${d.note}</div></div></div>`;});
document.getElementById('prem-prayer').innerHTML=PA[pur]||PA['소원'];
}

/* ── 우주 스타필드 ── */
(function(){
const cv=document.createElement('canvas');
cv.id='gd-cv';
cv.style.cssText='position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none';
document.body.insertBefore(cv,document.body.firstChild);

const ctx=cv.getContext('2d');
let W,H;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
resize();window.addEventListener('resize',resize);

function mkStar(){
const t=Math.random();
if(t<.65)return{x:Math.random()*W,y:Math.random()*H,r:Math.random()*.5+.2,vx:0,vy:0,a:Math.random()*.6+.15,da:(Math.random()-.5)*.003,col:'255,255,255',glow:false};
if(t<.88)return{x:Math.random()*W,y:Math.random()*H,r:Math.random()*.7+.4,vx:(Math.random()-.5)*.05,vy:(Math.random()-.5)*.04,a:Math.random()*.5+.2,da:(Math.random()-.5)*.004,col:Math.random()>.5?'200,210,255':'255,255,255',glow:false};
const c=['139,92,246','167,139,250','245,200,66','196,220,255','255,255,255'];
return{x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+.8,vx:(Math.random()-.5)*.1,vy:(Math.random()-.5)*.07,a:Math.random()*.4+.3,da:(Math.random()-.5)*.006,col:c[Math.floor(Math.random()*c.length)],glow:true};
}
const stars=Array.from({length:200},mkStar);
let meteors=[];
setInterval(()=>{if(Math.random()<.4)meteors.push({x:Math.random()*W*.6,y:Math.random()*H*.3,len:Math.random()*110+60,speed:Math.random()*8+5,angle:Math.PI/4+Math.random()*.3,life:1});},3500);

function draw(){
ctx.clearRect(0,0,W,H);
stars.forEach(s=>{
s.x+=s.vx;s.y+=s.vy;s.a+=s.da;
if(s.a<=.08||s.a>=.95)s.da*=-1;
if(s.x<0)s.x=W;if(s.x>W)s.x=0;if(s.y<0)s.y=H;if(s.y>H)s.y=0;
ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
ctx.fillStyle=`rgba(${s.col},${s.a})`;ctx.fill();
if(s.glow){
const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*5);
g.addColorStop(0,`rgba(${s.col},${s.a*.35})`);g.addColorStop(1,`rgba(${s.col},0)`);
ctx.beginPath();ctx.arc(s.x,s.y,s.r*5,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
const len=s.r*7*s.a;
ctx.save();ctx.globalAlpha=s.a*.18;ctx.strokeStyle=`rgb(${s.col})`;ctx.lineWidth=.6;
ctx.beginPath();ctx.moveTo(s.x-len,s.y);ctx.lineTo(s.x+len,s.y);ctx.stroke();
ctx.beginPath();ctx.moveTo(s.x,s.y-len);ctx.lineTo(s.x,s.y+len);ctx.stroke();
ctx.restore();
}
});
meteors=meteors.filter(m=>{
m.x+=Math.cos(m.angle)*m.speed;m.y+=Math.sin(m.angle)*m.speed;m.life-=.025;
if(m.life<=0)return false;
const tl=ctx.createLinearGradient(m.x,m.y,m.x-Math.cos(m.angle)*m.len,m.y-Math.sin(m.angle)*m.len);
tl.addColorStop(0,`rgba(255,255,255,${m.life*.9})`);tl.addColorStop(.3,`rgba(200,210,255,${m.life*.4})`);tl.addColorStop(1,'rgba(200,210,255,0)');
ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(m.x-Math.cos(m.angle)*m.len,m.y-Math.sin(m.angle)*m.len);
ctx.strokeStyle=tl;ctx.lineWidth=1.5;ctx.stroke();return true;
});
requestAnimationFrame(draw);
}
draw();
})();

</script>
