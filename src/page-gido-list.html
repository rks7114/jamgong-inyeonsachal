<style>
:root{
  --violet:#7c3aed;--violet-dark:#4c1d95;--violet-light:#a78bfa;
  --gold:#f5c842;--gold-light:#fde68a;
  --deep:#07040f;--card:#ffffff06;
  --border:#ffffff12;--text:#f1f0f8;--muted:#64748b;--subtle:#94a3b8
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans KR',sans-serif;background:var(--deep);color:var(--text);min-height:100vh;overflow-x:hidden}

/* ── 배경: 그라디언트 + 도트 그리드 + 오로라 ── */
body{background:radial-gradient(ellipse 120% 80% at 50% -10%,rgba(76,29,149,.55) 0%,rgba(7,4,15,1) 55%) fixed,var(--deep)}

/* 도트 그리드 오버레이 */
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(circle,rgba(167,139,250,.18) 1px,transparent 1px);
  background-size:32px 32px;
  mask-image:radial-gradient(ellipse 80% 70% at 50% 20%,black 30%,transparent 100%);
  -webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 20%,black 30%,transparent 100%)}

/* 오로라 블롭 */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora-blob{position:absolute;border-radius:50%;filter:blur(80px);animation:drift 16s ease-in-out infinite alternate}
.aurora-blob:nth-child(1){width:700px;height:500px;top:-200px;left:-200px;background:radial-gradient(ellipse,rgba(109,40,217,.55),transparent 70%)}
.aurora-blob:nth-child(2){width:600px;height:500px;bottom:-150px;right:-200px;background:radial-gradient(ellipse,rgba(245,200,66,.22),transparent 70%);animation-delay:-7s}
.aurora-blob:nth-child(3){width:500px;height:400px;top:30%;left:30%;background:radial-gradient(ellipse,rgba(167,139,250,.2),transparent 70%);animation-delay:-12s;animation-duration:20s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(35px,22px) scale(1.1)}}

/* ── Canvas 파티클 ── */
#jg-cv{position:fixed;inset:0;width:100vw;height:100vh;z-index:1;pointer-events:none}

/* ── 다르마 휠 ── */
.dharma-wheel{position:fixed;top:-80px;right:-100px;width:380px;height:380px;
  opacity:.045;z-index:0;pointer-events:none;
  animation:dharmaRotate 80s linear infinite}
@keyframes dharmaRotate{to{transform:rotate(360deg)}}

/* ── 상단 빛줄기 ── */
.light-beam{position:fixed;top:0;left:50%;transform:translateX(-50%);
  width:2px;height:260px;z-index:1;pointer-events:none;
  background:linear-gradient(to bottom,rgba(139,92,246,.9),transparent);
  animation:beamPulse 4s ease-in-out infinite}
.light-beam::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle,rgba(139,92,246,.28),transparent 70%);
  animation:beamPulse 4s ease-in-out infinite}
@keyframes beamPulse{0%,100%{opacity:.45}50%{opacity:1}}

/* ── CSS 파티클 (폴백) ── */
.p{position:fixed;border-radius:50%;pointer-events:none;z-index:1;animation:twinkle ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.1;transform:scale(.5)}}

/* ── 히어로 ── */
.hero{position:relative;z-index:2;padding:90px 24px 60px;text-align:center}

/* 중앙 글로우 후광 */
.hero::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:600px;height:400px;
  background:radial-gradient(ellipse,rgba(109,40,217,.35) 0%,rgba(124,58,237,.15) 40%,transparent 70%);
  pointer-events:none;z-index:0}

.hero-inner{position:relative;z-index:2;max-width:740px;margin:0 auto}

/* 뱃지 — 글로우 펄스 */
.hero-eyebrow{display:inline-flex;align-items:center;gap:10px;
  background:linear-gradient(135deg,rgba(109,40,217,.22),rgba(124,58,237,.08));
  border:1.5px solid rgba(167,139,250,.55);border-radius:99px;
  padding:9px 26px;font-size:11px;font-weight:800;color:#ddd6fe;
  letter-spacing:.18em;margin-bottom:24px;
  box-shadow:0 0 0 rgba(124,58,237,0),inset 0 0 12px rgba(167,139,250,.08);
  opacity:0;animation:fadeUp .6s .1s ease forwards,eyebrowGlow 3s 1s ease-in-out infinite}
@keyframes eyebrowGlow{
  0%,100%{box-shadow:0 0 16px rgba(124,58,237,.25)}
  50%{box-shadow:0 0 32px rgba(124,58,237,.55),0 0 60px rgba(124,58,237,.2)}}

/* 메인 타이틀 — 더 큰 사이즈 */
.hero-title{font-size:clamp(34px,7vw,68px);font-weight:900;line-height:1.1;
  letter-spacing:-.04em;margin-bottom:16px;
  opacity:0;animation:fadeUp .7s .3s ease forwards;
  text-shadow:0 0 60px rgba(109,40,217,.3)}
.hero-title .g{
  background:linear-gradient(125deg,#ffffff 0%,#e9d5ff 25%,#a78bfa 55%,#f5c842 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:gradShift 6s ease-in-out infinite alternate}
@keyframes gradShift{
  0%{filter:drop-shadow(0 0 18px rgba(167,139,250,.4))}
  100%{filter:drop-shadow(0 0 36px rgba(245,200,66,.45))}}

/* 서브텍스트 */
.hero-sub{font-size:15px;color:#94a3b8;line-height:1.9;max-width:520px;
  margin:0 auto 36px;word-break:keep-all;
  opacity:0;animation:fadeUp .65s .55s ease forwards}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* ── 히어로 스탯 ── */
.hero-stats{display:flex;gap:0;justify-content:center;flex-wrap:wrap;
  opacity:0;animation:fadeUp .6s .8s ease forwards;
  position:relative;
  background:rgba(109,40,217,.1);
  border:1px solid rgba(167,139,250,.3);
  border-radius:20px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  overflow:hidden;max-width:520px;margin:0 auto 20px;
  box-shadow:0 0 0 1px rgba(167,139,250,.08),0 8px 40px rgba(76,29,149,.25)}

/* 스캔라인 — 위에서 아래로 흐르는 빛 */
.hero-stats::before{content:'';position:absolute;top:-2px;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent 10%,rgba(167,139,250,.8) 50%,transparent 90%);
  animation:statScan 3s ease-in-out infinite}
@keyframes statScan{0%,100%{opacity:.4;transform:scaleX(.5)}50%{opacity:1;transform:scaleX(1)}}

.hero-stat{flex:1;text-align:center;padding:22px 12px;position:relative;min-width:80px}
.hero-stat::after{content:'';position:absolute;right:0;top:20%;height:60%;width:1px;
  background:linear-gradient(to bottom,transparent,rgba(167,139,250,.25),transparent)}
.hero-stat:last-child::after{display:none}
.hero-stat-num{font-size:30px;font-weight:900;
  background:linear-gradient(135deg,#e9d5ff,#a78bfa,#f5c842);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:1}
.hero-stat-label{font-size:10px;color:#64748b;font-weight:700;letter-spacing:.07em;margin-top:6px}

/* 스크롤 힌트 */
.hero-scroll{display:flex;flex-direction:column;align-items:center;gap:6px;
  color:rgba(167,139,250,.45);font-size:10px;letter-spacing:.22em;
  margin-top:36px;opacity:0;animation:fadeUp .5s 1.2s ease forwards}
.hero-scroll-arrow{width:20px;height:20px;
  border-right:2px solid rgba(167,139,250,.4);
  border-bottom:2px solid rgba(167,139,250,.4);
  transform:rotate(45deg);animation:scrolldown 1.7s ease-in-out infinite}
@keyframes scrolldown{0%,100%{opacity:.3;transform:rotate(45deg) translateY(0)}50%{opacity:1;transform:rotate(45deg) translateY(6px)}}

/* ── 툴바 ── */
.toolbar{position:relative;z-index:2;max-width:1200px;margin:0 auto 32px;padding:0 24px}
/* 툴바 — 흐르는 그라디언트 보더 */
.toolbar-glass{
  position:relative;
  background:linear-gradient(135deg,rgba(76,29,149,.14) 0%,rgba(10,6,20,.75) 100%);
  border-radius:26px;padding:26px 28px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 8px 40px rgba(0,0,0,.4),0 0 60px rgba(76,29,149,.12)}
.toolbar-glass::before{
  content:'';position:absolute;inset:0;border-radius:26px;padding:1px;
  background:linear-gradient(90deg,#7c3aed,#a78bfa,#f5c842,#a78bfa,#7c3aed);
  background-size:300% 100%;
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:borderFlow 5s linear infinite;pointer-events:none;z-index:0}

/* 검색창 — 바이올렛 글로우 */
.search-wrap{position:relative;margin-bottom:20px;z-index:1}
.search-input{
  width:100%;
  background:rgba(76,29,149,.1);
  border:1.5px solid rgba(124,58,237,.5);
  border-radius:16px;padding:15px 22px 15px 52px;
  font-size:15px;color:var(--text);
  font-family:'Noto Sans KR',sans-serif;outline:none;transition:all .3s;
  box-shadow:0 0 0 4px rgba(124,58,237,.06),0 2px 16px rgba(76,29,149,.25)}
.search-input:focus{
  border-color:rgba(167,139,250,.9);
  background:rgba(109,40,217,.14);
  box-shadow:0 0 0 4px rgba(124,58,237,.2),0 0 30px rgba(124,58,237,.2),0 2px 16px rgba(76,29,149,.4)}
.search-input::placeholder{color:rgba(167,139,250,.5)}
/* 검색 아이콘 보라색 글로우 */
.search-icon{color:rgba(167,139,250,.8);filter:drop-shadow(0 0 6px rgba(124,58,237,.6))}
.search-icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:18px;pointer-events:none}
.search-clear{position:absolute;right:16px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;display:none}
.filter-divider{height:1px;background:rgba(255,255,255,.07);margin:18px 0}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center;position:relative;z-index:1}
.filter-label{font-size:10px;font-weight:900;color:var(--muted);letter-spacing:.12em;white-space:nowrap;min-width:22px}
.filter-btn{font-size:12px;font-weight:700;padding:7px 16px;border-radius:99px;
  border:1px solid rgba(124,58,237,.2);
  background:linear-gradient(135deg,rgba(76,29,149,.1),rgba(15,10,30,.5));
  color:var(--subtle);cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .22s;white-space:nowrap}
.filter-btn.active{
  background:linear-gradient(135deg,rgba(124,58,237,.28),rgba(76,29,149,.2));
  border-color:rgba(167,139,250,.7);color:var(--violet-light);
  box-shadow:0 0 16px rgba(124,58,237,.25),0 0 0 1px rgba(167,139,250,.12) inset}
.filter-btn:hover:not(.active){
  background:linear-gradient(135deg,rgba(124,58,237,.14),rgba(15,10,30,.6));
  border-color:rgba(167,139,250,.4);color:#c4b5fd}
.result-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:18px;padding-top:18px;border-top:1px solid rgba(124,58,237,.18);position:relative;z-index:1}
.result-info{font-size:13px;color:var(--muted)}
.result-info strong{color:var(--violet-light)}
.sort-select{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:7px 14px;font-size:12px;color:var(--subtle);font-family:'Noto Sans KR',sans-serif;outline:none;cursor:pointer}
.sort-select option{background:#100c1e;color:var(--text)}

/* ── 카드 그리드 ── */
.grid{position:relative;z-index:2;max-width:1200px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-bottom:60px;perspective:1400px}

.tc{position:relative;background:rgba(255,255,255,.04);border-radius:24px;padding:26px 24px;overflow:hidden;
  transition:transform .45s cubic-bezier(.22,.68,0,1.2),box-shadow .45s,border-color .3s,opacity .6s;
  text-decoration:none;display:block;color:inherit;opacity:0;transform:translateY(22px);
  transform-style:preserve-3d;will-change:transform}
.tc.visible{opacity:1;transform:none}
.tc::before{content:'';position:absolute;inset:0;border-radius:24px;padding:1px;
  background:linear-gradient(135deg,rgba(124,58,237,.22),rgba(255,255,255,.04),rgba(245,200,66,.1));
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;transition:background .35s}
/* 홀로그램 shimmer 레이어 */
.tc::after{content:'';position:absolute;inset:0;border-radius:24px;
  background:linear-gradient(135deg,
    rgba(255,255,255,.13) 0%,rgba(255,255,255,.04) 40%,
    transparent 55%,rgba(167,139,250,.06) 75%,transparent 100%);
  opacity:0;transition:opacity .35s;pointer-events:none}
.tc:hover{
  transform:translateY(-14px) rotateX(-6deg) rotateY(2deg) scale(1.02);
  box-shadow:
    0 40px 100px rgba(124,58,237,.3),
    0 16px 40px rgba(0,0,0,.5),
    0 0 0 1px rgba(167,139,250,.35),
    inset 0 1px 0 rgba(255,255,255,.12)}
.tc:hover::before{background:linear-gradient(135deg,rgba(124,58,237,.75),rgba(167,139,250,.4),rgba(245,200,66,.3))}
.tc:hover::after{opacity:1}
.tc:hover .tc-icon{box-shadow:0 0 28px rgba(124,58,237,.45);transform:scale(1.12) rotate(-4deg) translateZ(8px)}
.tc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.tc-icon{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;border:1px solid rgba(255,255,255,.1);transition:all .3s cubic-bezier(.22,.68,0,1.2)}
.tc-badges{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.tc-badge{font-size:10px;font-weight:800;padding:3px 10px;border-radius:6px;letter-spacing:.06em;white-space:nowrap}
.tc-name{font-size:17px;font-weight:900;color:var(--text);margin-bottom:4px;line-height:1.3}
.tc-region{font-size:12px;color:var(--muted);margin-bottom:10px}
.tc-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tc-tag{font-size:11px;font-weight:700;padding:4px 12px;border-radius:99px;background:rgba(124,58,237,.08);border:1px solid rgba(124,58,237,.18);color:#c4b5fd}
.tc-desc{font-size:13px;color:var(--subtle);line-height:1.75;margin-bottom:18px}
.tc-footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(255,255,255,.07);padding-top:14px}
.tc-footer-type{font-size:11px;color:var(--muted);font-weight:700}
.tc-arrow{font-size:12px;font-weight:800;color:var(--violet-light);display:flex;align-items:center;gap:4px;transition:gap .2s}
.tc:hover .tc-arrow{gap:9px}

/* ── 오라클 배너 ── */
.oracle-banner{position:relative;z-index:2;max-width:1200px;margin:0 auto 32px;padding:0 24px}
.oracle-inner{
  background:linear-gradient(135deg,rgba(109,40,217,.2) 0%,rgba(76,29,149,.12) 50%,rgba(245,200,66,.06) 100%);
  border:1.5px solid rgba(124,58,237,.5);
  border-radius:26px;padding:28px 32px;
  display:flex;align-items:center;gap:22px;flex-wrap:wrap;
  position:relative;overflow:hidden;
  box-shadow:0 0 0 1px rgba(167,139,250,.06),0 16px 60px rgba(76,29,149,.3)}

/* 흐르는 그라디언트 보더 */
.oracle-inner::before{content:'';position:absolute;inset:0;border-radius:26px;padding:1.5px;
  background:linear-gradient(90deg,#7c3aed,#a78bfa,#f5c842,#7c3aed);
  background-size:300% 100%;
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:borderFlow 4s linear infinite;pointer-events:none}
@keyframes borderFlow{to{background-position:-300% 0}}
/* 우측 글로우 원 */
.oracle-inner::after{content:'';position:absolute;top:-60px;right:-60px;
  width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(124,58,237,.22),transparent 70%);
  pointer-events:none}

.oracle-icon{font-size:46px;flex-shrink:0;
  filter:drop-shadow(0 0 20px rgba(167,139,250,.7));
  animation:orbPulse 2.8s ease-in-out infinite;position:relative;z-index:1}
@keyframes orbPulse{
  0%,100%{filter:drop-shadow(0 0 14px rgba(167,139,250,.5));transform:scale(1)}
  50%{filter:drop-shadow(0 0 30px rgba(167,139,250,.9));transform:scale(1.06)}}

.oracle-text{flex:1;min-width:200px;position:relative;z-index:1}
.oracle-title{font-size:17px;font-weight:900;
  background:linear-gradient(90deg,#f5f3ff,#ddd6fe);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:7px}
.oracle-desc{font-size:13px;color:#94a3b8;line-height:1.75}

.oracle-btn{
  background:linear-gradient(135deg,#5b21b6,#7c3aed,#6d28d9);
  color:#fff;font-size:13px;font-weight:900;padding:14px 24px;
  border-radius:14px;text-decoration:none;white-space:nowrap;
  letter-spacing:.02em;transition:all .22s;position:relative;z-index:1;
  box-shadow:0 4px 20px rgba(76,29,149,.5),inset 0 1px 0 rgba(255,255,255,.15)}
.oracle-btn:hover{filter:brightness(1.15);transform:translateY(-2px);
  box-shadow:0 12px 36px rgba(76,29,149,.65)}

/* ── 페이지네이션 ── */
.pagination{position:relative;z-index:2;max-width:1200px;margin:0 auto 60px;padding:0 24px;display:flex;justify-content:center;align-items:center;gap:8px}
.pg-btn{width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:var(--subtle);font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .22s}
.pg-btn.active{background:rgba(124,58,237,.22);border-color:rgba(167,139,250,.55);color:var(--violet-light);box-shadow:0 0 16px rgba(124,58,237,.22)}
.pg-btn:hover:not(.active){background:rgba(255,255,255,.07)}
.pg-btn:disabled{opacity:.3;cursor:default}

/* ── 빈 결과 ── */
.empty{text-align:center;padding:80px 24px;color:var(--muted)}
.empty-icon{font-size:52px;margin-bottom:16px}
.empty-title{font-size:18px;font-weight:800;color:var(--subtle);margin-bottom:8px}

/* ── FAB ── */
.chatbot-fab{position:fixed;bottom:24px;right:18px;z-index:9999;background:linear-gradient(135deg,#4c1d95,#7c3aed);color:#fff;border:none;border-radius:99px;padding:12px 20px;font-size:13px;font-weight:900;cursor:pointer;font-family:'Noto Sans KR',sans-serif;box-shadow:0 8px 28px rgba(76,29,149,.5);display:flex;align-items:center;gap:8px;transition:all .25s;text-decoration:none}

  const sortVal = document.querySelector('.sort-select').value;
  let filtered = DB.filter(d => {
    const matchType = !activeType || d.type.some(t => t.includes(activeType));
    const matchRegion = !activeRegion || d.region.includes(activeRegion);
    const matchQ = !q || d.name.includes(q) || d.region.includes(q) || d.tags.some(t=>t.includes(q)) || d.desc.includes(q) || d.type.some(t=>t.includes(q));
    return matchType && matchRegion && matchQ;
  });

  if(sortVal === 'name') filtered.sort((a,b) => a.name.localeCompare(b.name));
  else if(sortVal === 'region') filtered.sort((a,b) => a.region.localeCompare(b.region));

  currentPage = 1;
  renderCards(filtered);
}

function setType(btn, val){
  document.querySelectorAll('[data-type]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeType = val;
  applyFilters();
}
function setRegion(btn, val){
  document.querySelectorAll('[data-region]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeRegion = val;
  applyFilters();
}
function clearSearch(){
  document.getElementById('search-input').value = '';
  document.getElementById('search-clear').style.display = 'none';
  applyFilters();
}

function renderCards(data){
  const total = data.length;
  const totalPages = Math.ceil(total / PER_PAGE);
  const start = (currentPage - 1) * PER_PAGE;
  const slice = data.slice(start, start + PER_PAGE);
  const countEl = document.getElementById('result-count');
  countEl.innerHTML = `전체 <strong>${total}</strong>개 도량`;

  const grid = document.getElementById('card-grid');
  if(!slice.length){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🔍</div><div class="empty-title">검색 결과가 없습니다</div><p style="font-size:13px;color:var(--muted)">다른 검색어나 필터를 사용해보세요.</p></div>`;
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  grid.innerHTML = slice.map(d => {
    const pg = (d.pg||'page-gido-detail').replace(/^page-/,'/');
    const href = d.detail ? `${pg}?id=${d.id}` : '#';
    const typeLabels = d.type.join(' · ');
    return `<a class="tc" href="${href}" ${!d.detail?'onclick="return false"':''}>
      <div class="tc-top">
        <div class="tc-icon" style="background:${d.iconBg}">${d.icon}</div>
        <div class="tc-badges">
          ${d.badge?`<span class="tc-badge" style="background:${d.badgeColor};color:${d.badgeText}">${d.badge}</span>`:''}
          ${d.detail?'<span class="tc-badge" style="background:rgba(124,58,237,.15);color:#a78bfa">상세정보</span>':'<span class="tc-badge" style="background:rgba(255,255,255,.05);color:#475569">준비중</span>'}
        </div>
      </div>
      <div class="tc-name">${d.name}</div>
      <div class="tc-region">📍 ${d.region}</div>
      <div class="tc-tags">${d.tags.map(t=>`<span class="tc-tag">${t}</span>`).join('')}</div>
      <div class="tc-desc">${d.desc}</div>
      <div class="tc-footer">
        <span class="tc-footer-type">${typeLabels}</span>
        ${d.detail?`<span class="tc-arrow">상세보기 →</span>`:`<span style="font-size:11px;color:var(--muted)">준비중</span>`}
      </div>
    </a>`;
  }).join('');

  // 카드 리빌
  setTimeout(revealCards, 30);

  // 페이지네이션
  const pg = document.getElementById('pagination');
  if(totalPages <= 1){pg.innerHTML='';return;}
  let btns = '';
  btns += `<button class="pg-btn" onclick="changePage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
  for(let i=1;i<=totalPages;i++){
    if(i===1||i===totalPages||Math.abs(i-currentPage)<=1) btns+=`<button class="pg-btn ${i===currentPage?'active':''}" onclick="changePage(${i})">${i}</button>`;
    else if(Math.abs(i-currentPage)===2) btns+=`<span style="color:var(--muted);padding:0 4px">…</span>`;
  }
  btns += `<button class="pg-btn" onclick="changePage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>›</button>`;
  pg.innerHTML = btns;
  // store for changePage
  pg._data = data;
}

function changePage(n){
  const data = document.getElementById('pagination')._data;
  if(!data) return;
  currentPage = n;
  renderCards(data);
  window.scrollTo({top: document.querySelector('.toolbar').offsetTop - 20, behavior:'smooth'});
}

/* ── CSS 반짝이 별 (고정 위치 트윙클) ── */
(function(){
  /* 흰별·청백별 위주 — 우주 고정 별 느낌 */
  const cols=['rgba(255,255,255,.85)','rgba(220,230,255,.75)','rgba(200,210,255,.65)',
              'rgba(167,139,250,.55)','rgba(255,255,255,.5)'];
  for(let i=0;i<40;i++){
    const p=document.createElement('div');
    p.className='p';
    const sz=Math.random()*2.2+.5;  /* 0.5~2.7px — 진짜 별처럼 작게 */
    const dur=2.5+Math.random()*5;
    const top=Math.random()*100;
    p.style.cssText=`width:${sz}px;height:${sz}px;`+
      `left:${Math.random()*100}%;top:${top}%;`+

      `animation-duration:${dur}s;animation-delay:${Math.random()*8}s;`+

/* ── 숫자 카운트업 ── */
function countUp(id,target,suffix){
  const el=document.getElementById(id);
  if(!el)return;
  const dur=1500,step=16;
  const inc=target/(dur/step);
  let cur=0;
  const t=setInterval(()=>{
    cur=Math.min(cur+inc,target);
    el.textContent=Math.round(cur)+(suffix||'');
    if(cur>=target)clearInterval(t);
  },step);
}
setTimeout(()=>{countUp('cnt-total',465,'+');countUp('cnt-type',7,'');countUp('cnt-region',17,'');},900);

/* ── 스크롤 리빌 옵저버 ── */
const _srObs=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){e.target.classList.add('visible');_srObs.unobserve(e.target);}
  });
},{threshold:.1});

/* ── 카드 리빌 적용 (renderCards 후 호출) ── */
function revealCards(){
  document.querySelectorAll('.tc:not(.visible)').forEach((el,i)=>{
    el.style.transitionDelay=(i*.06)+'s';
    _srObs.observe(el);
  });
}

// ── 외부 데이터(gido-data.js) 로드 후 DB 병합 ──
(function loadExtra(){
  var url='https://raw.githubusercontent.com/rks7114/jamgong-inyeonsachal/main/src/data/gido-data.js';
  fetch(url)
    .then(function(r){return r.ok?r.text():Promise.reject(r.status);})
    .then(function(txt){
      // eval로 window.GIDO_EXTRA 세팅
      try{(new Function(txt))();}catch(e){console.warn('gido-data eval err:',e);}
      if(window.GIDO_EXTRA&&Array.isArray(window.GIDO_EXTRA)){
        // 중복 방지: 기존 DB에 없는 id만 추가
        var ids=new Set(DB.map(function(d){return d.id;}));
        window.GIDO_EXTRA.forEach(function(d){
          if(!ids.has(d.id)){d.detail=true;DB.push(d);ids.add(d.id);}
        });
        console.log('기도도량 총 '+DB.length+'개 로드 완료');
      }
    })
    .catch(function(e){console.warn('gido-data.js 로드 실패(오프라인/캐시 사용):',e);})
    .finally(function(){
      applyFilters();
      revealCards();
    });
})();

/* ── 3D 마우스 틸트 ── */
(function(){
  function attachTilt(card){
    card.addEventListener('mousemove',function(e){
      const r=card.getBoundingClientRect();
      const x=(e.clientX-r.left)/r.width-.5;   // -0.5 ~ 0.5
      const y=(e.clientY-r.top)/r.height-.5;
      card.style.transform=
        `translateY(-14px) rotateX(${(-y*14).toFixed(2)}deg) rotateY(${(x*10).toFixed(2)}deg) scale(1.02)`;
    });
    card.addEventListener('mouseleave',function(){
      card.style.transform='';
    });
  }
  // 현재 카드 + 향후 렌더된 카드에도 적용
  function tiltAll(){
    document.querySelectorAll('.tc:not([data-tilt])').forEach(c=>{
      c.setAttribute('data-tilt','1');
      attachTilt(c);
    });
  }
  tiltAll();
  // renderCards 이후에도 다시 적용
  const _orig=window.revealCards||function(){};
  const _tiltTimer=setInterval(tiltAll,600);
  setTimeout(()=>clearInterval(_tiltTimer),12000);
})();

/* ── 우주 별빛 스타필드 엔진 ── */
(function(){
  const cv=document.getElementById('jg-cv');
  if(!cv)return;
  const ctx=cv.getContext('2d');
  let W,H;
  function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;}
  resize();
  window.addEventListener('resize',resize);

  /* 별 종류: 원거리(tiny·정적), 중거리(small·느린 이동), 근거리(bright·반짝) */
  function mkStar(){
    const tier=Math.random();
    if(tier<.65) return {           /* 원거리 — 미세 고정 별 */
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*.5+.2,
      vx:0, vy:0,
      a:Math.random()*.6+.15,
      da:(Math.random()-.5)*.003,
      col:'255,255,255', glow:false, tier:0
    };
    if(tier<.88) return {           /* 중거리 — 파란빛/흰 별 */
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*.7+.4,
      vx:(Math.random()-.5)*.06, vy:(Math.random()-.5)*.04,
      a:Math.random()*.5+.2,
      da:(Math.random()-.5)*.004,
      col:Math.random()>.5?'200,210,255':'255,255,255',
      glow:false, tier:1
    };
    /* 근거리 — 컬러 글로우 별 (보라·골드·청백) */
    const cols=['139,92,246','167,139,250','245,200,66','196,220,255','255,255,255'];
    return {
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*1.2+.8,
      vx:(Math.random()-.5)*.12, vy:(Math.random()-.5)*.08,
      a:Math.random()*.4+.3,
      da:(Math.random()-.5)*.006,
      col:cols[Math.floor(Math.random()*cols.length)],
      glow:true, tier:2
    };
  }

  const stars=Array.from({length:200},mkStar);

  /* 유성 (간헐적) */
  let meteors=[];
  function spawnMeteor(){
    meteors.push({
      x:Math.random()*W*.6, y:Math.random()*H*.3,
      len:Math.random()*120+60,
      speed:Math.random()*8+6,
      angle:Math.PI/4+Math.random()*.3,
      a:1, life:1
    });
  }
  setInterval(()=>{if(Math.random()<.35)spawnMeteor();},3200);

  let t=0;
  function draw(){
    ctx.clearRect(0,0,W,H);
    t+=.008;

    /* 별 그리기 */
    stars.forEach(s=>{
      s.x+=s.vx; s.y+=s.vy; s.a+=s.da;
      if(s.a<=.08||s.a>=.95)s.da*=-1;
      if(s.x<0)s.x=W; if(s.x>W)s.x=0;
      if(s.y<0)s.y=H; if(s.y>H)s.y=0;

      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(${s.col},${s.a})`;
      ctx.fill();

      /* 근거리 별 — 십자 글로우 */
      if(s.glow){
        const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*5);
        g.addColorStop(0,`rgba(${s.col},${s.a*.35})`);
        g.addColorStop(1,`rgba(${s.col},0)`);
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.r*5,0,Math.PI*2);
        ctx.fillStyle=g;
        ctx.fill();
        /* 십자 빛줄기 */
        const len=s.r*7*s.a;
        ctx.save();
        ctx.globalAlpha=s.a*.18;
        ctx.strokeStyle=`rgb(${s.col})`;
        ctx.lineWidth=.6;
        ctx.beginPath();ctx.moveTo(s.x-len,s.y);ctx.lineTo(s.x+len,s.y);ctx.stroke();
        ctx.beginPath();ctx.moveTo(s.x,s.y-len);ctx.lineTo(s.x,s.y+len);ctx.stroke();
        ctx.restore();
      }
    });

    /* 유성 */
    meteors=meteors.filter(m=>{
      m.x+=Math.cos(m.angle)*m.speed;
      m.y+=Math.sin(m.angle)*m.speed;
      m.life-=.025;
      if(m.life<=0)return false;
      const tail=ctx.createLinearGradient(
        m.x,m.y,
        m.x-Math.cos(m.angle)*m.len,m.y-Math.sin(m.angle)*m.len
      );
      tail.addColorStop(0,`rgba(255,255,255,${m.life*.9})`);
      tail.addColorStop(.3,`rgba(200,210,255,${m.life*.4})`);
      tail.addColorStop(1,'rgba(200,210,255,0)');
      ctx.beginPath();
      ctx.moveTo(m.x,m.y);
      ctx.lineTo(m.x-Math.cos(m.angle)*m.len,m.y-Math.sin(m.angle)*m.len);
      ctx.strokeStyle=tail;
      ctx.lineWidth=1.5;
      ctx.stroke();
      return true;
    });

    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
