<script>
(function(){
var parts=['/gido-list-css','/gido-list-js1','/gido-list-js2','/gido-list-js3'];
var i=0;
function next(){if(i>=parts.length)return;
  fetch(parts[i++]).then(function(r){return r.text();}).then(function(t){
    var sm=t.match(/<style[^>]*>([\s\S]*?)<\/style>/i);
    if(sm){var s=document.createElement('style');s.textContent=sm[1];document.head.appendChild(s);}
    var jm=/<script[^>]*>([\s\S]*?)<\/script>/gi,m;
    while((m=jm.exec(t))!==null){if(m[1].trim()){var el=document.createElement('script');el.textContent=m[1];document.body.appendChild(el);}}
    next();
  });
}
next();
})();
</script>
