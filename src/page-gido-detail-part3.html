(function(){
  var id=(new URLSearchParams(location.search).get('id')||'').toLowerCase();
  var d=DB[id];
  if(!d){document.getElementById('not-found').style.display='block';return;}
  document.getElementById('pg-wrap').style.display='block';
  document.title=d.name+' 기도도량 | 잼공인연사찰';
  document.getElementById('pg-title').textContent=d.name+' | 잼공인연사찰';
  var img=document.getElementById('pg-img');
  img.alt=d.name;
  fetch('https://ko.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(d.name))
    .then(function(r){return r.json();})
    .then(function(w){var s=w.originalimage||w.thumbnail;if(s&&s.source)img.src=s.source.replace(/\/\d+px-/,'/800px-');})
    .catch(function(){});
  document.getElementById('pg-badges').innerHTML=d.badges.map(function(b){return'<span class="hb '+b.c+'">'+b.t+'</span>';}).join('');
  document.getElementById('pg-name').textContent=d.name;
  document.getElementById('pg-loc').textContent='📍 '+d.loc+' · '+d.cat;
  document.getElementById('pg-info').innerHTML=d.info.map(function(i){return'<div class="ib"><div class="ib-l">'+i.l+'</div><div class="ib-v'+(i.g?' g':'')+'">'+i.v+'</div></div>';}).join('');
  document.getElementById('pg-intro').innerHTML=d.intro;
  document.getElementById('pg-prayer').innerHTML=d.prayer.map(function(p){return'<div class="prayer-box"><div class="prayer-title">'+p.title+'</div><div class="prayer-text">'+p.text.replace(/\n/g,'<br>')+'</div></div>';}).join('');
  document.getElementById('pg-steps').innerHTML=d.steps.map(function(s,i){return'<li class="step-item"><div class="step-num">'+(i+1)+'</div><div><div class="step-t">'+s.t+'</div><div class="step-d">'+s.d+'</div></div></li>';}).join('');
  document.getElementById('pg-access').innerHTML=d.access;
  document.getElementById('pg-rel').innerHTML=d.rel.map(function(r){return'<a class="rel-card" href="'+(r.pg||'page-gido-detail').replace(/^page-/,'/')+'?id='+r.id+'"><div class="rel-icon">'+r.icon+'</div><div class="rel-name">'+r.name+'</div><div class="rel-desc">'+r.desc+'</div></a>';}).join('');
})();
